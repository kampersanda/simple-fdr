[package]
name = "simple-fdr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small, reproducible experiments for multiple-pattern string matching"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
